dominio: ventas
fuentes:
  pedidos:
    formato: csv
    ruta_landing: landing/ventas/pedidos/
    opciones_lectura:
      header: true
      delimiter: ;
    clave_negocio:
      - id_pedido
    modo_carga: merge
    contrato: contracts/silver/pedidos.yml
  clientes:
    formato: parquet
    ruta_landing: landing/ventas/clientes/
    clave_negocio:
      - id_cliente
    modo_carga: merge
    contrato: contracts/silver/clientes.yml
